name: collect

# Started by hand. A cron schedule and Pages publication stay off until
# docs/METRICS.md and docs/LIMITATIONS.md have been reviewed against a real dataset.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: iceberg-community-health smoke --limit 1
