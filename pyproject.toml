[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iceberg-community-health"
version = "0.1.0"
description = "Read-only community health metrics for the Apache Iceberg ecosystem."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Russell Spitzer"}]
dependencies = [
  "duckdb>=1.0",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
iceberg-community-health = "iceberg_community_health.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
